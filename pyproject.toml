[project]
name = "gantrain"
version = "0.1.0"
description = "Train a FastGAN on your own photographs, on one GPU: curate, train, sample, evaluate. Play it live with ganlive."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustave Cortal" }]
keywords = ["gan", "fastgan", "image-generation", "generative-art", "few-shot", "small-dataset",
            "training", "high-resolution", "pytorch", "generative-adversarial-networks",
            "latent-space", "real-time", "ganlive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# torch and torchvision are not listed: the right builds depend on your GPU, so they are
# installed first, from the accelerator's own wheel index (see README).
dependencies = [
  # CLIP and DINOv2 image embeddings, for semantic dedup and the evaluation metrics.
  "transformers>=4.50",
  "numpy>=1.26",
  "pillow>=10.3",
  # Opens HEIC/HEIF photographs.
  "pillow-heif>=0.16",
  "tqdm",
  "typer>=0.12",
  "scipy>=1.13",
  "imagehash>=4.3",
  # Writes the interpolation video.
  "opencv-python-headless>=4.10",
  # Counts physical cores, to keep training on a hybrid CPU's performance cores.
  "psutil>=6",
  # LPIPS, the discriminator's perceptual reconstruction loss.
  "lpips>=0.1.4",
]

[project.urls]
Homepage = "https://github.com/gustavecortal/gantrain"
Models = "https://huggingface.co/collections/gustavecortal/ganlive-6ac56a61006a78b3e1ff5406"
Issues = "https://github.com/gustavecortal/gantrain/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gantrain = "gantrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gantrain"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer options are function calls in argument defaults by design.
"src/gantrain/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
